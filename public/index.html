<!doctype html>
<!-- 시스템이 다크 모드여도 항상 밝은 화면으로 — styles.css 의 다크 블록이 이 값을 보고 비켜난다 -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C94F0D">
<!-- 표지는 남의 CDN(네이버·카카오·인스타그램·넷플릭스…)에서 그대로 가져다 쓴다.
     그런 곳은 대개 **다른 사이트에서 부르는 것**을 막는데, 그 판단을 Referer 로 한다.
     아예 안 보내면 "어디서 왔는지 모르는 요청" 이 되어 통과하는 경우가 많다.
     덤으로, 우리 주소를 CDN 마다 알리지 않는다. -->
<meta name="referrer" content="no-referrer">
<title>HabHobby</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>
  /* 테마 색은 서버에서 받아 와야 알 수 있는데, 그때는 이미 styles.css 의 기본 주황이
     한 번 그려진 뒤다 — 새로 고칠 때마다 주황이 번쩍이고 나서 고른 색으로 바뀌었다.
     app.js 가 지난번에 얹은 값을 그대로 담아 두므로, 첫 그림 전에 그것부터 되살린다.
     여기서 색을 계산하지는 않는다 — 계산은 app.js 한 곳에만 있다. */
  try {
    var v = JSON.parse(localStorage.getItem("hh-theme") || "null");
    if (v) for (var k in v) {
      if (k === "theme-color") document.querySelector('meta[name="theme-color"]').content = v[k];
      else document.documentElement.style.setProperty(k, v[k]);
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="page">
    <div class="app">
      <div class="app-bar">
        <div class="bar-left">
          <!-- 좁은 화면에서는 알림 종이 사이드 메뉴 안으로 들어간다. 메뉴를 열지 않으면
               소식이 온 줄을 알 수 없으므로, 여는 버튼이 대신 숫자를 지고 있는다. -->
          <button class="icon-btn" id="btn-menu" aria-label="메뉴 열기" title="메뉴"
            ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17"/></svg
  ><span class="fab-badge" id="menu-badge" hidden></span></button>
          <button class="icon-btn" id="btn-search" aria-label="작품 검색" title="검색"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.8"/><path d="M20 20l-4.2-4.2"/></svg></button>
          <div class="brand">Hab<span>Hobby</span></div>
        </div>
        <div class="bar-right">
          <!-- 폴더 연결이 끊겼다는 소식. 탭 옆에 두는 이유는 그것이 **어느 탭에서든 오는**
               소식이기 때문이다 — 폴더 탭 안에 숨겨 두면 캘린더만 보는 사람에게는 안 온다. -->
          <button class="icon-btn bell" id="btn-bell" aria-label="알림" title="알림">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.6 8.5-2.6 8.5h17.2S18 15 18 8.5"/><path d="M13.8 20.5a2.2 2.2 0 0 1-3.6 0"/></svg
            ><span class="fab-badge" id="bell-badge" hidden></span>
          </button>
          <div class="tabs" role="tablist">
            <button role="tab" id="tab-cal" aria-selected="true">캘린더</button>
            <button role="tab" id="tab-home" aria-selected="false">페이지</button>
            <button role="tab" id="tab-lib" aria-selected="false">폴더</button>
          </div>
        </div>
      </div>

      <div class="screen" id="screen"></div>

      <button class="fab" id="btn-inbox" aria-label="작품 추가">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg
        ><span class="fab-badge" id="fab-badge" hidden></span>
      </button>
      <!-- 캘린더에서만 나타난다. 달력 칸에 안 보이는 것들을 곁창으로 연다.
           붉은 숫자는 달지 않는다 — 담기는 것이 "밀린 일" 이 아니라 날짜가 없는 작품들이라
           재촉할 이야기가 아니다. 버튼이 서 있는 것만으로 볼 것이 있다는 표가 된다. -->
      <button class="fab right" id="btn-idle" aria-label="추가 목록" title="추가 목록" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5H7A2 2 0 0 0 5 6.5v12.6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2"/><rect x="9" y="2.6" width="6" height="3.8" rx="1.3"/></svg>
      </button>
      <!-- 폴더 탭에서만, 받은 초대가 있을 때만 나온다. 추가 목록과 같은 자리를 쓴다 —
           한쪽은 캘린더에서만, 한쪽은 폴더에서만 나오므로 겹치지 않는다. -->
      <button class="fab right" id="btn-fi" aria-label="폴더 초대" title="폴더 초대" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.2" width="18" height="13.6" rx="2.4"/><path d="M3.6 7.6l7.4 4.9a2 2 0 0 0 2 0l7.4-4.9"/></svg
        ><span class="fab-badge" id="fi-badge" hidden></span>
      </button>

      <div class="drawer-back" id="drawer-back" hidden>
        <nav class="drawer">
          <div class="handle-zone vert" aria-hidden="true"><div class="handle"></div></div>
          <button class="drawer-x" id="menu-close" aria-label="메뉴 닫기" title="닫기"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
          <div class="drawer-head">
            <b>Hab<span>Hobby</span></b>
            <!-- 좁은 화면에서만. 넓은 화면에서는 상단바 탭 옆에 그대로 선다. -->
            <button class="icon-btn bell" id="menu-bell" aria-label="알림" title="알림"
              ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.6 8.5-2.6 8.5h17.2S18 15 18 8.5"/><path d="M13.8 20.5a2.2 2.2 0 0 1-3.6 0"/></svg
              ><span class="fab-badge" id="menu-bell-badge" hidden></span></button>
          </div>
          <button class="menu-item" id="menu-search">
            <span class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.8"/><path d="M20 20l-4.2-4.2"/></svg></span>
            <span class="mt">검색<small>제목으로 전체에서 찾기</small></span>
          </button>
          <button class="menu-item" id="menu-friends">
            <span class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.2" cy="8" r="3.4"/><path d="M3 20c0-3.4 2.8-5.5 6.2-5.5s6.2 2.1 6.2 5.5"/><path d="M16 5.2a3.4 3.4 0 0 1 0 6.6"/><path d="M17.6 15c2.1.7 3.4 2.4 3.4 5"/></svg></span>
            <span class="mt">친구<small><span data-count="friends">0</span>명 · 폴더 공유</small></span>
          </button>
          <button class="menu-item" id="menu-watched">
            <span class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 12.6l4.8 4.8L19.2 6.9"/></svg></span>
            <span class="mt">감상 완료<small><span data-count="watched">0</span>편</small></span>
          </button>
          <button class="menu-item" id="menu-dropped">
            <span class="mi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 6.8h16.4"/><path d="M9.4 6.8V5A1.4 1.4 0 0 1 10.8 3.6h2.4A1.4 1.4 0 0 1 14.6 5v1.8"/><path d="M6.4 6.8l.95 12.3a2 2 0 0 0 2 1.85h5.3a2 2 0 0 0 2-1.85l.95-12.3"/><path d="M10.3 10.6v6.6M13.7 10.6v6.6"/></svg></span>
            <span class="mt">휴지통<small><span data-count="dropped">0</span>편</small></span>
          </button>
          <div class="drawer-foot">
            <span id="drawer-stat"></span>
            <button class="icon-btn" id="menu-settings" aria-label="설정" title="설정"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.01 5.29L10.21 2.77L13.79 2.77L13.99 5.29A7 7 0 0 1 15.34 5.85L17.26 4.21L19.79 6.74L18.15 8.66A7 7 0 0 1 18.71 10.01L21.23 10.21L21.23 13.79L18.71 13.99A7 7 0 0 1 18.15 15.34L19.79 17.26L17.26 19.79L15.34 18.15A7 7 0 0 1 13.99 18.71L13.79 21.23L10.21 21.23L10.01 18.71A7 7 0 0 1 8.66 18.15L6.74 19.79L4.21 17.26L5.85 15.34A7 7 0 0 1 5.29 13.99L2.77 13.79L2.77 10.21L5.29 10.01A7 7 0 0 1 5.85 8.66L4.21 6.74L6.74 4.21L8.66 5.85A7 7 0 0 1 10.01 5.29Z"/><circle cx="12" cy="12" r="3.1"/></svg></button>
          </div>
        </nav>
      </div>

      <div class="sheet-back" id="sheet-back" hidden>
        <div class="sheet" id="sheet"></div>
      </div>
    </div>

</div>
<!-- 위의 인라인 SVG 는 app.js 의 ICONS 와 **같은 그림**이다(search · cog · plus ·
     users · x · check · trash). 여기 두는 까닭은 맨 위 줄과 서랍이 app.js 가 내려오기
     전에 이미 보여야 해서다. 한쪽만 고치면 조용히 어긋나니 함께 고칠 것. -->
<script type="module" src="/app.js"></script>
</body>
</html>
