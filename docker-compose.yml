services:
  habhobby:
    build: .
    container_name: habhobby
    # 터널이 컨테이너 이름으로 찾아오므로 포트를 밖으로 열 필요가 없다.
    # 다만 개발 중 localhost 로도 보려고 남겨 둔다 — **이 PC 안에서만.**
    #
    # 한때 "8080:8080" 이었는데, 그 표기는 localhost 가 아니라 **모든 네트워크(0.0.0.0)** 에
    # 연다. 같은 Wi-Fi 에 있는 누구든 http://<이 PC>:8080 으로 Cloudflare 를 거치지 않고
    # 들어올 수 있었고, 그 길은 암호화가 없어 거기서 로그인하면 비밀번호와 세션이 평문으로
    # 흘렀다. 주석이 말하던 뜻(localhost 로 보기)과 표기가 어긋나 있던 것이다.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # 이미지를 다시 만들어도 목록이 그대로 남도록 프로젝트 폴더를 그대로 쓴다
      - ./data:/app/data
    restart: unless-stopped

  # 밖에서 들어오는 길. 포트를 여는 대신 Cloudflare 로 나가는 연결을 만든다 —
  # 공유기 설정도, 공인 IP 도, 인증서도 필요 없다.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: habhobby-tunnel
    # 길은 cloudflared/config.yml 이 정한다 — 그 파일에 왜인지 적어 두었다.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 이 .env 에 없습니다}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - habhobby
    restart: unless-stopped
