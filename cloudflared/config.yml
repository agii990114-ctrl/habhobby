# 이 터널은 길을 **여기서** 정한다.
#
# 대시보드에 설정을 두는 터널이라면 cloudflared 가 접속하면서 규칙을 받아 온다. 그런데 이
# 터널은 받아 오는 설정이 비어 있다(metrics 의 /config 가 version:-1, 규칙은 503 하나).
# 곧 「연결하는 쪽이 제 파일로 정하는」 터널이고, 그 파일은 지금까지 다른 컴퓨터에만
# 있었다 — 그래서 이 컨테이너로 들어온 요청은 갈 데가 없어 전부 503 이었다.
#
# **호스트 이름을 적지 않는다.** 규칙에 도메인을 적으면 그 도메인이 바뀔 때마다 이 파일도
# 같이 고쳐야 하고, 안 고치면 조용히 503 이 된다. 애초에 이 터널로 들어오는 요청은
# Cloudflare 가 「이 터널에 걸린 도메인」만 보내 주므로, 여기서 다시 도메인을 가릴 까닭이
# 없다. 한 줄이면 무엇이 걸려 있든 앱으로 간다.
#
# habhobby 는 같은 compose 망에 있는 앱 컨테이너 이름이다 — 포트를 밖으로 열지 않아도
# 이 이름으로 찾아간다.
ingress:
  - service: http://habhobby:8080
