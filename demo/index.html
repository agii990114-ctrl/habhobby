<title>HabHobby</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #FBF9FA;
    --surface: #FFFFFF;
    --surface-2: #F5F0F2;
    --surface-3: #EDE4E8;
    --ink: #241B1F;
    --ink-2: #5C4F55;
    --ink-3: #8C7E84;
    --line: #E7DDE1;
    --line-2: #D8CBD1;
    --accent: #C2255C;
    --accent-soft: #FCEEF3;
    --accent-ink: #A61E4D;
    --good: #2B8A3E;
    --good-soft: #EBFBEE;
    --warn: #9C6F00;
    --warn-soft: #FFF9DB;
    --shadow: 0 1px 2px rgba(36,27,31,.06), 0 8px 24px -12px rgba(36,27,31,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171114;
      --surface: #201820;
      --surface-2: #2A2028;
      --surface-3: #362A32;
      --ink: #F0E8EC;
      --ink-2: #C0B2B9;
      --ink-3: #8C7E84;
      --line: #3A2E35;
      --line-2: #4A3B44;
      --accent: #F06595;
      --accent-soft: #33202A;
      --accent-ink: #F783AC;
      --good: #69DB7C;
      --good-soft: #1E2E22;
      --warn: #E6C229;
      --warn-soft: #2E2818;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171114; --surface: #201820; --surface-2: #2A2028; --surface-3: #362A32;
    --ink: #F0E8EC; --ink-2: #C0B2B9; --ink-3: #8C7E84;
    --line: #3A2E35; --line-2: #4A3B44;
    --accent: #F06595; --accent-soft: #33202A; --accent-ink: #F783AC;
    --good: #69DB7C; --good-soft: #1E2E22; --warn: #E6C229; --warn-soft: #2E2818;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.6;
    word-break: keep-all;
    padding: 20px;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .page { max-width: 1080px; margin: 0 auto; }

  /* ── App shell ───────────────────────── */
  .app {
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 22px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
    height: calc(100vh - 40px); max-height: 820px; min-height: 520px; position: relative;
    max-width: 880px; margin: 0 auto;
  }

  /* 모바일에서는 앱이 화면 전체를 쓴다 — 창 안의 창처럼 보일 이유가 없다 */
  @media (max-width: 700px) {
    body { padding: 0; }
    .app {
      height: 100vh; height: 100dvh;
      max-height: none; min-height: 0; max-width: none;
      border: 0; border-radius: 0; box-shadow: none;
    }
  }
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { font-family: "Hahmlet", serif; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  .bar-left { display: flex; align-items: center; gap: 9px; }
  .icon-btn {
    width: 30px; height: 30px; flex: none; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-3);
    font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 99px; padding: 3px; }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-3);
    font-size: 13px; font-weight: 600; padding: 5px 13px; border-radius: 99px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* ＋ 버튼이 스크롤 방향에 따라 비켜주므로 아래 여백은 최소만 둔다 */
  .screen { flex: 1; overflow-y: auto; padding: 14px 16px 22px; }
  .screen-title { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 2px 0 12px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    font-size: 12.5px; padding: 4px 11px; border-radius: 99px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(106px, 1fr)); gap: 14px; }
  .work { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; display: block; }
  .cover {
    aspect-ratio: 3/4; border-radius: 10px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: "Hahmlet", serif; font-weight: 700; font-size: 26px; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,.35);
  }
  .cover .badge {
    position: absolute; left: 5px; top: 5px; width: 15px; height: 15px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Sans KR", sans-serif; font-size: 8.5px; font-weight: 700;
    text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .cover .ep {
    position: absolute; right: 0; bottom: 0; left: 0; padding: 12px 6px 4px;
    background: linear-gradient(transparent, rgba(0,0,0,.62));
    font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500;
    text-align: right; text-shadow: none;
  }
  .work h4 { margin: 6px 0 1px; font-size: 12.5px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .work time { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .empty { text-align: center; color: var(--ink-3); font-size: 13.5px; padding: 40px 20px; }

  /* ── 플랫폼별 가로 슬라이드 ───────────────────────── */
  .plat { margin-bottom: 20px; }
  .plat:last-child { margin-bottom: 4px; }
  /* 레일이 화면 끝까지 흘러나가므로 구분선도 같이 흘려보낸다 */
  .plat + .plat::before {
    content: ""; display: block; height: 1px;
    background: var(--line); margin: 0 -16px 18px;
  }
  .plat-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .plat-h .pmark {
    width: 19px; height: 19px; flex: none; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  }
  .plat-h b { font-size: 14px; font-weight: 600; }
  /* 아직 이름을 안 붙인 도메인은 주소 그대로 — 주소처럼 보이게 둔다 */
  .plat-h b.dom { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .plat-h span { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .edit-dom {
    border: 0; background: none; cursor: pointer; padding: 2px 4px;
    font-size: 12px; line-height: 1; opacity: .45; border-radius: 6px;
  }
  .edit-dom:hover { opacity: 1; background: var(--surface-2); }

  /* 도메인 색 고르기 */
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .swatches button {
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .dom-preview {
    display: flex; align-items: center; gap: 8px; padding: 11px 13px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px;
  }
  .dom-preview .pmark { width: 22px; height: 22px; font-size: 11px; }
  .dom-preview b { font-size: 14px; font-weight: 600; }
  .dom-preview em { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-family: "IBM Plex Mono", monospace; }

  /* 좌우로 화면 끝까지 흘려보내면 더 밀 수 있다는 게 읽힌다 */
  .rail {
    display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    margin: 0 -16px; padding: 0 16px 6px;
  }
  .rail .work { flex: none; width: 106px; scroll-snap-align: start; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }
  .rail::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  .rail { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

  /* ── Folders ───────────────────────── */
  .folders { display: flex; flex-direction: column; gap: 7px; }
  .folder {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 12px 9px 9px; cursor: pointer; color: inherit;
  }
  .folder:hover { border-color: var(--line-2); background: var(--surface-3); }
  .folder .mini {
    width: 42px; height: 42px; flex: none; border-radius: 8px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1.5px;
    background: var(--line);
  }
  .folder .mini i { display: block; }
  .folder .mini.solo {
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; background: var(--surface); border: 1px solid var(--line);
  }
  .folder .txt { min-width: 0; flex: 1; }
  .folder .txt b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder .txt span { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .folder .chev { color: var(--ink-3); font-size: 15px; flex: none; }
  .folder.ghost {
    background: transparent; border-style: dashed; color: var(--ink-3);
    justify-content: center; font-size: 13px; font-weight: 600; padding: 11px;
  }
  .folder.ghost:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .crumb button {
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; flex: none;
    font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .crumb button:hover { border-color: var(--ink-3); color: var(--ink); }
  .crumb h3 { margin: 0; font-family: "Hahmlet", serif; font-size: 16px; font-weight: 600;
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb .count { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }

  /* ── Calendar ───────────────────────── */
  .today-strip {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px;
    padding: 11px 14px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .today-strip b { font-family: "Hahmlet", serif; font-size: 17px; color: var(--accent-ink); }
  .today-strip span { font-size: 12.5px; color: var(--ink-2); }

  /* 요일을 열로 놓는 표. 같은 마크업이 좁은 화면에서는 세로로 쌓인다. */
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 11px; overflow: hidden;
  }
  .col { background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
  .col[data-today] { background: var(--accent-soft); }
  .colh {
    padding: 8px 6px 7px; text-align: center; border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .col[data-today] .colh { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .colh b { font-size: 12.5px; font-weight: 700; }
  .col[data-today] .colh b { color: var(--accent-ink); }
  .colh span {
    display: block; font-size: 10px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .colb { padding: 6px 5px 8px; display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .rest { font-size: 11px; color: var(--ink-3); padding: 4px 3px; text-align: center; }

  .row {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: none; border: 0; padding: 6px 4px; border-radius: 8px; cursor: pointer; color: inherit;
  }
  .row:hover { background: var(--surface-2); }
  .row .thumb {
    width: 27px; height: 36px; border-radius: 5px; flex: none; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-family: "Hahmlet", serif; font-size: 13px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .row .rt { min-width: 0; flex: 1; }
  .row .rt b { display: block; font-size: 13px; font-weight: 600; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .rt span { font-size: 11px; color: var(--ink-3); }
  .row .pdot { width: 7px; height: 7px; border-radius: 99px; flex: none; }

  /* 표 안의 칸은 좁으므로 더 조밀하게 */
  .row.mini { padding: 4px 3px; gap: 6px; }
  .row.mini .thumb { width: 20px; height: 27px; font-size: 10px; border-radius: 3px; }
  .row.mini .rt b {
    font-size: 11px; line-height: 1.3; white-space: normal;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row.mini .rt span, .row.mini .pdot { display: none; }

  @media (max-width: 700px) {
    .cal-grid { grid-template-columns: 1fr; }
    .colh { display: flex; align-items: baseline; gap: 9px; text-align: left; }
    .colh span { display: inline; margin: 0; }
    .row.mini { padding: 6px 4px; gap: 9px; }
    .row.mini .thumb { width: 27px; height: 36px; font-size: 13px; border-radius: 5px; }
    .row.mini .rt b { font-size: 12.5px; -webkit-line-clamp: 1; }
    .row.mini .rt span { display: block; }
    .rest { text-align: left; }
  }

  .cal-sec { margin-top: 18px; }
  .cal-sec > h4 {
    margin: 0 0 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3);
  }

  .dows { display: flex; gap: 4px; }
  .dows button {
    flex: 1; padding: 7px 0; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-3);
  }
  .dows button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .pickers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .pick {
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2);
    font-size: 12.5px; padding: 5px 11px; border-radius: 99px; cursor: pointer;
  }
  .pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .pick.add { border-style: dashed; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .emoji-row button {
    width: 34px; height: 34px; border-radius: 8px; font-size: 17px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--surface-2); line-height: 1;
  }
  .emoji-row button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  /* ── 추가함 버튼 ───────────────────────── */
  .fab {
    position: absolute; left: 14px; bottom: 14px; z-index: 4;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    border: 0; background: var(--accent); color: #fff;
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px -2px rgba(194, 37, 92, .5), 0 1px 3px rgba(0, 0, 0, .18);
    transition: transform .22s cubic-bezier(.4, 0, .2, 1), opacity .18s ease, background .12s ease;
  }
  .fab:hover { background: var(--accent-ink); transform: translateY(-1px); }
  .fab:active { transform: none; }
  /* 내려 읽을 땐 비켜준다 */
  .fab.tucked { transform: translateY(62px); opacity: 0; pointer-events: none; }
  .fab-badge {
    position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px;
    padding: 0 4px; border-radius: 99px; background: var(--ink); color: var(--surface);
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    border: 2px solid var(--surface); font-variant-numeric: tabular-nums;
  }
  .fab-badge[hidden] { display: none; }

  /* 새 콘텐츠 목록 */
  .mt-count {
    display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px;
    border-radius: 99px; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    font-variant-numeric: tabular-nums; vertical-align: 1px;
  }
  .uf-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 9px 4px; cursor: pointer; color: inherit; border-radius: 8px;
  }
  .uf-item:hover { background: var(--surface-2); }
  .uf-item:last-child { border-bottom: 0; }
  .uf-item .ub { min-width: 0; flex: 1; }
  .uf-item .ub b {
    display: block; font-size: 13px; font-weight: 600; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .uf-item .ub span { font-size: 11px; color: var(--ink-3); }
  .uf-item .chev { color: var(--ink-3); font-size: 15px; flex: none; }

  /* ── Side menu ───────────────────────── */
  .drawer-back { position: absolute; inset: 0; background: rgba(20, 12, 16, .42); display: flex; z-index: 6; }
  .drawer-back[hidden] { display: none; }
  .drawer {
    width: min(272px, 78%); background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 15px 11px 12px;
    animation: slidein .2s ease-out;
  }
  @keyframes slidein { from { transform: translateX(-16px); opacity: .4 } to { transform: none; opacity: 1 } }
  .drawer-head {
    font-family: "Hahmlet", serif; font-weight: 700; font-size: 18px;
    padding: 3px 9px 15px; letter-spacing: -.01em;
  }
  .drawer-head span { color: var(--accent); }
  .menu-item {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: none; border: 0; padding: 10px 9px; border-radius: 10px;
    cursor: pointer; color: inherit;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item .mi {
    width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-2);
  }
  .menu-item:hover .mi { background: var(--accent-soft); color: var(--accent-ink); }
  .menu-item .mt { min-width: 0; font-size: 14px; font-weight: 600; }
  .menu-item .mt small {
    display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-top: 1px;
  }
  .drawer-foot {
    margin-top: auto; padding: 10px 4px 0 9px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .btn {
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink);

    .map(v => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const onWhite = 1.05 / (L + 0.05);        // 흰 글자를 얹었을 때의 대비비
  const onBlack = (L + 0.05) / 0.05;        // 검은 글자를 얹었을 때의 대비비
  return onBlack > onWhite ? "#1B1B1B" : "#FFFFFF";
}

// 이름 붙이기 전의 도메인 — 주소를 그대로 이름으로 쓴다
function domainPlatform(host) {
  return {
    id: DOMAIN_PREFIX + host, host, isDomain: true,
    name: host, color: DOMAIN_DEFAULT_COLOR, fg: readableOn(DOMAIN_DEFAULT_COLOR),
    initial: "?", mediaType: "link",
  };
}

/* 사용자가 바꾼 이름·색·마크를 얹는다. 내장 플랫폼과 도메인 모두 같은 방식으로 다룬다. */
function applyOverride(base) {
  const o = overrides[base.id];
  if (!o) return base;
  const color = o.color || base.color;
  return { ...base, name: o.name || base.name, initial: o.initial || base.initial,
    color, fg: readableOn(color), overridden: true };
}
const SHORTENERS = ["naver.me", "kko.kakao.com", "kakao.link", "youtu.be/s", "bit.ly", "tv.naver.me"];

const MEDIA = {

};

/* ── 파서 ───────────────────────────────────── */
function parseShared(raw) {
  const text = (raw || "").trim();
  if (!text) return { state: "empty" };
  // 스킴이 없으면 https를 붙인다. 저장되는 값은 항상 스킴을 포함한 절대 URL이다.
  const hasScheme = /^[a-z][a-z0-9+.\-]*:/i.test(text);
  let u;
  try { u = new URL(hasScheme ? text : "https://" + text); }
  catch { return { state: "invalid", message: "URL 형식으로 읽을 수 없습니다." }; }

  // http/https만 허용 — javascript:, data: 같은 주소가 링크로 저장되면 안 된다
  if (u.protocol !== "http:" && u.protocol !== "https:")
    return { state: "invalid", message: `http 또는 https 주소만 등록할 수 있습니다. (${esc(u.protocol)})` };
  if (!u.hostname || !u.hostname.includes("."))
    return { state: "invalid", message: "도메인이 없는 주소입니다." };

  const host = u.hostname.replace(/^www\./, "");

  if (SHORTENERS.some(s => host === s || host.endsWith("." + s))) {
    return { state: "short", host,
      message: "단축 URL입니다. 서버가 리다이렉트를 한 번 따라가 원본 URL을 얻은 뒤 규칙을 적용합니다. 브라우저만으로는 이 단계를 대신할 수 없습니다." };
  }

  for (const p of PLATFORMS) {
    if (!p.hosts.some(h => host === h || host.endsWith("." + h))) continue;
    const r = p.parse(u, host);
    if (r) return { state: "matched", platform: p, mediaType: p.mediaType, ...r };
    return { state: "fallback", platform: domainPlatform(host), mediaType: "link",
      seriesId: u.href, listUrl: u.href, appUrl: null, host,
      message: `${p.name} 도메인이지만 알려진 경로 형태가 아닙니다. 링크로 등록됩니다.` };
  }

  return { state: "fallback", platform: domainPlatform(host), mediaType: "link",
    seriesId: u.href, listUrl: u.href, appUrl: null, host,
    message: `규칙이 없는 도메인입니다. ${host} 묶음으로 등록되고, 이름·색·마크는 나중에 붙일 수 있습니다.` };
}

function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

function ago(ts) {
  const d = now - ts, m = d / 6e4;
  if (m < 60) return "방금";
  const hrs = m / 60;
  if (hrs < 24) return `${Math.floor(hrs)}시간 전`;
  const days = hrs / 24;
  if (days < 2) return "어제";
  if (days < 7) return `${Math.floor(days)}일 전`;
  return `${Math.floor(days / 7)}주 전`;
}

/* ── 캘린더 ───────────────────────────────────── */
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const SCHED_LABEL = {
  weekly: "매주 연재", dated: "날짜 지정", always: "상시",
  done: "완결", hiatus: "휴재", unknown: "일정 미정",
};

const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();

function schedText(w) {
  const s = w.schedule;
  if (s.mode === "weekly" && s.days.length)
    return `매주 ${[...s.days].sort().map(d => DOW[d]).join("·")}요일`;
  if (s.mode === "dated" && s.next) {
    const d = new Date(s.next);
    return `${d.getMonth() + 1}/${d.getDate()} (${DOW[d.getDay()]})${s.label ? " " + s.label : ""}`;
  }
  return SCHED_LABEL[s.mode] || "일정 미정";
}

function rowHtml(w, sub, mini) {
  const p = platformOf(w.platformId);
  return `<button class="row${mini ? " mini" : ""}" data-id="${w.id}">
    <span class="thumb" style="${coverStyle(w.title)}">${esc(w.title.slice(0, 1))}</span>
    <span class="rt"><b>${esc(w.title)}</b><span>${esc(sub || p.name)}</span></span>
    <span class="pdot" style="background:${p.color}"></span>
  </button>`;
}

function updatesOn(date) {
  const dow = date.getDay();
  return activeWorks().filter(w => {
    const s = w.schedule;
    if (s.mode === "weekly") return s.days.includes(dow);
    if (s.mode === "dated") return s.next && sameDay(s.next, date);
    return false;
  }).sort((a, b) => b.visits - a.visits || b.lastAt - a.lastAt);  // 많이 본 순, 같으면 최근 순
}

/* 어느 구획에도 놓이지 않은 작품이 생기지 않도록, "일정 없음"은 열거가 아니라 여집합으로 구한다.
   데이터가 어떤 상태든 작품이 캘린더에서 조용히 사라지는 일은 없어야 한다. */
function idleReason(w) {
  const s = w.schedule;
  if (s.mode === "weekly" && !s.days.length) return "요일 미선택";
  if (s.mode === "dated" && !s.next) return "날짜 미지정";
  return SCHED_LABEL[s.mode] || "일정 미정";
}

function renderCalendar() {
  const t0 = midnight();
  const todayList = updatesOn(t0);
  const placed = new Set();

  let html = `<div class="today-strip">
    <b>${DOW[t0.getDay()]}요일</b>
    <span>${todayList.length ? `${todayList.length}편 업데이트` : "오늘은 쉬어가는 날"}</span>
  </div>`;

  // 표는 순서가 고정이라야 읽힌다 — 오늘부터 회전시키지 않고 월~일로 고정하고 오늘만 강조한다.
  const todayDow = t0.getDay();
  html += `<div class="cal-grid">`;
  for (let i = 1; i <= 7; i++) {
    const dow = i % 7;                                   // 월(1) … 토(6) … 일(0)
    const offset = (dow - todayDow + 7) % 7;
    const d = new Date(t0.getTime() + offset * 864e5);
    const list = updatesOn(d);
    list.forEach(w => placed.add(w.id));
    const isToday = offset === 0;
    html += `<div class="col"${isToday ? " data-today" : ""}>
      <div class="colh">
        <b>${DOW[dow]}</b>
        <span>${isToday ? "오늘" : `${d.getMonth() + 1}/${d.getDate()}`}</span>
      </div>
      <div class="colb">
        ${list.length ? list.map(w => rowHtml(w, null, true)).join("") : `<div class="rest">—</div>`}
      </div>
    </div>`;
  }
  html += `</div>`;

  const later = activeWorks().filter(w => w.schedule.mode === "dated" && w.schedule.next
    && w.schedule.next >= t0.getTime() + 7 * 864e5)
    .sort((a, b) => a.schedule.next - b.schedule.next);
  if (later.length) {
    later.forEach(w => placed.add(w.id));
    html += `<div class="cal-sec"><h4>이후 공개 예정</h4>` +
      later.map(w => rowHtml(w, schedText(w))).join("") + `</div>`;
  }

  // 상시 — 요일에 매이지 않고 언제든 볼 수 있는 것. 완결작도 성격이 같아 함께 놓인다.
  const anytime = byRecent(activeWorks().filter(w => ["always", "done"].includes(w.schedule.mode)));
  if (anytime.length) {
    anytime.forEach(w => placed.add(w.id));
    html += `<div class="cal-sec"><h4>상시 · 언제든</h4>` +
      anytime.map(w => rowHtml(w,
        `${SCHED_LABEL[w.schedule.mode]} · ${platformOf(w.platformId).name}`)).join("") + `</div>`;
  }

  const idle = byRecent(activeWorks().filter(w => !placed.has(w.id)));
  if (idle.length) {
    html += `<div class="cal-sec"><h4>일정 없음</h4>` +
      idle.map(w => rowHtml(w, `${idleReason(w)} · ${platformOf(w.platformId).name}`)).join("") + `</div>`;
  }
  return html;
}

function render() {
  document.getElementById("tab-home").setAttribute("aria-selected", tab === "home");
  document.getElementById("tab-cal").setAttribute("aria-selected", tab === "cal");
  document.getElementById("tab-lib").setAttribute("aria-selected", tab === "lib");

  let html = "";

  if (tab === "cal") {
    html = renderCalendar();

  } else if (tab === "home") {
    html += `<div class="screen-title">최근 본 순 · 플랫폼별</div>`;
    html += railsHtml(byRecent(activeWorks()));

  } else if (openFolderId === null) {
    html += `<div class="screen-title">폴더</div><div class="folders">`;
    html += folderRow("_all", "🗂", "전체");
    if (activeWorks().some(w => !w.folders.length)) html += folderRow("_none", "🫙", "미분류");
    html += folders.map(f => folderRow(f.id, f.emoji, f.name)).join("");
    html += `<button class="folder ghost" data-new-folder>＋ 새 폴더</button></div>`;

  } else {
    const f = folderOf(openFolderId);
    const name = openFolderId === "_all" ? "🗂 전체"
      : openFolderId === "_none" ? "🫙 미분류"
      : f ? `${f.emoji} ${f.name}` : "폴더";
    const inFolder = byRecent(worksIn(openFolderId));
    const shown = inFolder.filter(w => filter === "all" || w.mediaType === filter);

    html += `<div class="crumb">
      <button data-back aria-label="폴더 목록으로">‹</button>
      <h3>${esc(name)}</h3>
      <span class="count">${inFolder.length}개</span>
      ${f ? `<button data-edit-folder aria-label="폴더 편집">⋯</button>` : ""}
    </div>`;

    const types = ["all", ...Object.keys(MEDIA).filter(t => inFolder.some(w => w.mediaType === t))];
    if (types.length > 2) {
      html += `<div class="chips">` + types.map(t =>
        `<button class="chip" data-filter="${t}" aria-pressed="${filter === t}">${t === "all" ? "전체" : MEDIA[t]}</button>`
      ).join("") + `</div>`;
    }

    html += gridHtml(shown, openFolderId === "_none"
      ? "미분류 작품이 없습니다."
      : "이 폴더는 비어 있습니다.<br>작품을 열어 폴더를 지정해보세요.");
  }

  screen.innerHTML = html;

  const badge = document.getElementById("fab-badge");
  const n = unfiled().length;
  badge.textContent = n > 99 ? "99+" : n;
  badge.hidden = n === 0;

  // 화면을 새로 그리면 스크롤이 맨 위로 돌아간다 — 숨김 상태도 같이 푼다
  fabEl.classList.remove("tucked");
  lastScrollY = 0;
}

/* ── 시트 ───────────────────────────────────── */
const back = document.getElementById("sheet-back"), sheet = document.getElementById("sheet");
const closeSheet = () => { back.hidden = true; sheet.innerHTML = ""; };
back.addEventListener("click", e => { if (e.target === back) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const d = document.getElementById("drawer-back");
  if (d && !d.hidden) d.hidden = true; else closeSheet();
});

function openSheet(html) { sheet.innerHTML = `<div class="handle"></div>` + html; back.hidden = false; }

/* ── 폴더 편집 시트 ───────────────────────── */
const EMOJIS = ["📁", "📌", "⚔️", "💕", "🍿", "📖", "🎬", "🔥", "🌙", "😂", "👻", "🏆"];

function openFolderForm(existing, after) {
  let emoji = existing ? existing.emoji : "📁";
  openSheet(`
    <h3>${existing ? "폴더 편집" : "새 폴더"}</h3>
    <p class="sub">한 작품은 여러 폴더에 동시에 들어갈 수 있습니다.</p>
    <div class="field">
      <label>아이콘</label>
      <div class="emoji-row" id="emo">${EMOJIS.map(e =>
        `<button data-e="${e}" aria-pressed="${e === emoji}">${e}</button>`).join("")}</div>
    </div>
    <div class="field">
      <label for="fname">이름</label>
      <input id="fname" value="${esc(existing ? existing.name : "")}" placeholder="예: 주말에 몰아볼 것" maxlength="24">
    </div>
    <div class="link-row">
      ${existing ? `<button class="btn" id="fdel">폴더 삭제</button>` : ""}
      <button class="btn primary" id="fsave">${existing ? "저장" : "만들기"}</button>
    </div>
    ${existing ? `<div class="note">폴더를 삭제해도 작품은 목록에 남습니다. 묶음만 사라집니다.</div>` : ""}
  `);

  const nameEl = sheet.querySelector("#fname");
  sheet.querySelector("#emo").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    emoji = b.dataset.e;
    sheet.querySelectorAll("#emo button").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.e === emoji));
  });

  sheet.querySelector("#fsave").onclick = () => {
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    if (existing) { existing.name = name; existing.emoji = emoji; save(); after(existing); }
    else after(newFolder(name, emoji));
  };

  const del = sheet.querySelector("#fdel");
  if (del) del.onclick = () => {
    folders = folders.filter(f => f.id !== existing.id);
    for (const w of works) w.folders = w.folders.filter(id => id !== existing.id);
    save(); after(null);
  };

  nameEl.focus();
}

/* ── 연재 일정 편집 ─────────────────────────
   실제 서비스에서는 서버가 목록 페이지에서 자동 수집하고,
   틀렸거나 못 읽었을 때 사용자가 여기서 고친다. */
const SCHED_MODES = [
  ["weekly", "매주"], ["always", "상시"], ["dated", "날짜 지정"],
  ["done", "완결"], ["hiatus", "휴재"], ["unknown", "미정"],
];
const SCHED_HINT = {
  always: "한 번에 전부 공개된 작품. 넷플릭스 오리지널 시즌 전체 공개처럼 요일에 매이지 않는 것들입니다. 캘린더의 &ldquo;상시 · 언제든&rdquo;에 모입니다.",
  done: "연재가 끝난 작품. 상시와 함께 &ldquo;언제든&rdquo;에 모입니다.",
  hiatus: "쉬어가는 중. 캘린더의 &ldquo;일정 없음&rdquo;에 모입니다.",
  unknown: "일정을 모르는 상태. 캘린더의 &ldquo;일정 없음&rdquo;에 모입니다.",
};

/* "매주"만으로는 캘린더에 놓일 자리가 정해지지 않는다. 고른 결과를 즉시 되돌려준다. */
function weeklySummary(s) {
  if (!s.days.length)
    return `<span style="color:var(--warn);font-weight:600">요일을 하나 이상 골라주세요</span> — 고르기 전까지는 &ldquo;일정 없음&rdquo;에 머뭅니다.`;
  const d = [...s.days].sort().map(i => DOW[i]).join("·");
  return `매주 <b style="color:var(--accent-ink)">${d}요일</b>에 캘린더에 놓입니다.`;
}

/* 일정 편집기 — 등록 시트와 작품 시트가 공유한다 (schedule 객체를 직접 받는다) */
function schedHtml(s, note) {
  const nextVal = s.next ? new Date(s.next - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10) : "";
  return `<div class="field" data-sched>
    <label>연재 일정${note ? ` <span style="text-transform:none;letter-spacing:0">— ${note}</span>` : ""}</label>
    <div class="pickers" style="margin-bottom:8px">
      ${SCHED_MODES.map(([m, l]) =>
        `<button class="pick" data-mode="${m}" aria-pressed="${s.mode === m}">${l}</button>`).join("")}
    </div>
    ${s.mode === "weekly"
      ? `<div class="dows">${DOW.map((d, i) =>
          `<button data-dow="${i}" aria-pressed="${s.days.includes(i)}">${d}</button>`).join("")}</div>
         <div class="rest" data-sched-sum style="padding:7px 2px 0">${weeklySummary(s)}</div>`
      : s.mode === "dated"
      ? `<input type="date" data-next value="${nextVal}">`
      : `<div class="rest" style="padding:2px">${SCHED_HINT[s.mode] || ""}</div>`}
  </div>`;
}

function wireSched(root, s, onChange) {
  const box = root.querySelector("[data-sched]"); if (!box) return;
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.mode) { s.mode = b.dataset.mode; onChange(true); return; }
    if (b.dataset.dow !== undefined) {
      const d = +b.dataset.dow, i = s.days.indexOf(d);
      if (i < 0) s.days.push(d); else s.days.splice(i, 1);
      b.setAttribute("aria-pressed", i < 0);
      const sum = box.querySelector("[data-sched-sum]");
      if (sum) sum.innerHTML = weeklySummary(s);
      onChange(false);
    }
  });
  const dateEl = box.querySelector("[data-next]");
  if (dateEl) dateEl.addEventListener("change", () => {
    s.next = dateEl.value ? new Date(dateEl.value + "T00:00").getTime() : null;
    onChange(false);
  });
}

/* 폴더 선택 칩 — 작품 시트와 등록 시트가 공유 */
function pickerHtml(selected) {
  return `<div class="field">
    <label>폴더</label>
    <div class="pickers" data-picker>
      ${folders.map(f => `<button class="pick" data-fid="${f.id}" aria-pressed="${selected.includes(f.id)}">${f.emoji} ${esc(f.name)}</button>`).join("")}
      <button class="pick add" data-picker-new>＋ 새 폴더</button>
    </div>
  </div>`;
}

function wirePicker(root, selected, onChange, reopen) {
  const box = root.querySelector("[data-picker]"); if (!box) return;
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pickerNew !== undefined) {
      openFolderForm(null, f => { if (f) selected.push(f.id); reopen(); });
      return;
    }
    const fid = b.dataset.fid, i = selected.indexOf(fid);
    if (i < 0) selected.push(fid); else selected.splice(i, 1);
    b.setAttribute("aria-pressed", i < 0);
    onChange();
  });
}

/* 작품 시트 — 볼 것인가 지울 것인가, 두 가지만 묻는다. 나머지는 설정으로 뺐다. */
function openWork(id) {
  const w = works.find(x => x.id === id); if (!w) return;
  const p = platformOf(w.platformId);
  const viaWeb = settings.openMode === "web" || !w.appUrl;
  openSheet(`
    <h3>${esc(w.title)}</h3>
    <p class="sub">${p.name} · ${MEDIA[w.mediaType]} · ${esc(schedText(w))} · ${ago(w.lastAt)}${w.episode ? ` · 마지막 ${esc(w.episode)}` : ""}</p>
    <a class="link-btn primary" id="go" href="${esc(viaWeb ? w.listUrl : w.appUrl)}"
       ${viaWeb ? 'target="_blank" rel="noopener"' : ""}>보러가기<small>${viaWeb
         ? (w.appUrl ? "웹으로 (설정에서 변경)" : "웹으로")
         : `${esc(p.name)} 앱으로`}</small></a>
    <button class="btn" data-act="settings" style="width:100%;margin-top:9px">설정</button>
  `);

  sheet.querySelector("#go").onclick = () => {
    w.lastAt = Date.now(); w.visits++; save(); render();
    if (!viaWeb) {
      // 앱이 없으면 페이지가 그대로 남는다 — 그때만 웹으로 넘긴다
      const t = setTimeout(() => window.open(w.listUrl, "_blank", "noopener"), 1500);
      const cancel = () => clearTimeout(t);
      document.addEventListener("visibilitychange", cancel, { once: true });
      window.addEventListener("pagehide", cancel, { once: true });
    }
    closeSheet();
  };
  sheet.querySelector('[data-act="settings"]').onclick = () => openWorkSettings(id);
}

/* 작품 설정 — 연재 일정과 폴더.
   opts.back  : 돌아갈 곳 (기본은 작품 상세)
   opts.mode  : "done"(완료) | "add"(취소·추가) — 새 콘텐츠에서 들어오면 "add"
   opts.snap  : 되돌릴 원본. 일정 모드가 바뀌면 화면을 다시 그리므로,
                그때 스냅샷을 새로 뜨지 않도록 재진입마다 그대로 넘긴다. */
function openWorkSettings(id, opts) {
  const o = typeof opts === "function" ? { back: opts } : (opts || {});
  const w = works.find(x => x.id === id); if (!w) return;
  const mode = o.mode || "done";
  const goBack = o.back || (() => openWork(id));
  const snap = o.snap || {
    schedule: JSON.parse(JSON.stringify(w.schedule)),
    folders: [...w.folders],
  };
  const again = extra => openWorkSettings(id, { ...o, mode, back: o.back, snap, ...extra });
  const revert = () => {
    w.schedule = JSON.parse(JSON.stringify(snap.schedule));
    w.folders = [...snap.folders];
    save(); render();
  };
  openSheet(`
    <div class="crumb">
      <button data-back-work aria-label="작품으로 돌아가기">‹</button>
      <h3>작품 설정</h3>
    </div>
    <p class="sub">${esc(w.title)}</p>
    ${schedHtml(w.schedule)}
    ${pickerHtml(w.folders)}
    <div class="field">
      <label>목록에서 내리기</label>
      <div class="link-row">
        <button class="btn" data-act="watched">✓ 시리즈 감상 완료</button>
        <button class="btn" data-act="dropped">✕ 관심 없어짐</button>
      </div>
      <div class="rest" style="text-align:left;padding:7px 2px 0">
        어느 쪽이든 지워지지 않습니다. 홈·캘린더에서만 빠지고 왼쪽 메뉴의 보관함으로 옮겨집니다.
      </div>
    </div>
    ${mode === "add"
      ? `<div class="link-row" style="margin-top:4px">
           <button class="btn" data-cancel>취소</button>
           <button class="btn primary" data-done>설정 완료</button>
         </div>`
      : `<button class="btn primary" style="width:100%;margin-top:4px" data-done>완료</button>`}
  `);
  wireSched(sheet, w.schedule, redraw => {
    save(); render();
    if (redraw) again();          // 모드가 바뀌면 하위 입력칸 자체가 바뀐다
  });
  wirePicker(sheet, w.folders, () => { save(); render(); }, () => { save(); again(); });

  const cancel = () => { revert(); goBack(); };
  sheet.querySelector("[data-back-work]").onclick = mode === "add" ? cancel : goBack;
  sheet.querySelector("[data-done]").onclick = () => {
    if (mode === "add") w.filed = true;   // 폴더를 안 정했어도 설정을 마쳤으면 대기열에서 뺀다
    save(); render(); goBack();
  };
  const cancelBtn = sheet.querySelector("[data-cancel]");
  if (cancelBtn) cancelBtn.onclick = cancel;
  for (const st of ["watched", "dropped"]) {
    sheet.querySelector(`[data-act="${st}"]`).onclick = () => {
      w.state = st; save(); closeSheet(); render();
    };
  }
}

/* 보관함 — 감상 완료 / 관심 없어짐. 되돌리거나 여기서만 지운다. */
function openArchive(state, pendingDelId) {
  const meta = STATES[state];
  const list = worksInState(state);
  openSheet(`
    <h3>${meta.icon} ${meta.label}</h3>
    <p class="sub">${meta.desc} · ${list.length}편</p>
    <div class="arch-list">
    ${list.length ? list.map(w => {
      const p = platformOf(w.platformId);
      const confirming = w.id === pendingDelId;
      return `<div class="arch${confirming ? " confirming" : ""}">
        <span class="thumb" style="${coverStyle(w.title)}">${esc(w.title.slice(0, 1))}</span>
        <span class="rt"><b>${esc(w.title)}</b><span>${esc(p.name)} · ${ago(w.lastAt)}</span></span>
        ${confirming
          ? `<span class="arch-act"><em>영구 삭제할까요?</em>
               <button class="mini-btn" data-cancel="${w.id}">취소</button>
               <button class="mini-btn danger" data-confirm="${w.id}">삭제</button></span>`
          : `<span class="arch-act">
               <button class="mini-btn" data-restore="${w.id}">되돌리기</button>
               <button class="mini-btn" data-ask="${w.id}">삭제</button></span>`}
      </div>`;
    }).join("") : `<div class="empty">비어 있습니다.</div>`}
    </div>
  `);

  // 리스너는 매번 새로 만들어지는 .arch-list에 붙인다 — sheet에 붙이면 호출마다 누적된다
  sheet.querySelector(".arch-list").addEventListener("click", e => {
    const b = e.target.closest("button[data-restore],button[data-ask],button[data-cancel],button[data-confirm]");
    if (!b) return;
    const { restore, ask, cancel, confirm } = b.dataset;
    if (restore) {
      const w = works.find(x => x.id === restore);
      if (w) w.state = "active";
      save(); render(); openArchive(state);
    } else if (ask) {
      openArchive(state, ask);                      // 확인 단계로 바꿔 다시 그린다
    } else if (cancel) {
      openArchive(state);
    } else if (confirm) {
      works = works.filter(x => x.id !== confirm);
      save(); render(); openArchive(state);
    }
  });
}

/* 도메인 꾸미기 — 규칙 없는 도메인에 이름·색·마크를 붙인다 */
// 전부 흑 또는 백 중 하나와 4.5:1 이상 대비가 나오도록 고른 값 (readableOn이 자동으로 고른다)
const DOMAIN_COLORS = [
  "#655A61", "#C2255C", "#E8590C", "#F08C00", "#20713A",
  "#0CA678", "#1971C2", "#5F3DC4", "#9C36B5", "#1B1B1B",
];

function openPlatformEdit(platformId) {
  // 기본값(오버라이드를 뺀 원래 모습)과 현재 설정을 함께 잡는다
  const base = platformId.startsWith(DOMAIN_PREFIX)
    ? domainPlatform(platformId.slice(DOMAIN_PREFIX.length))
    : (PLATFORMS.find(p => p.id === platformId) || FALLBACK);
  const cur = overrides[platformId] || {};
  const draft = {
    name: cur.name || "",
    initial: cur.initial || base.initial,
    color: cur.color || base.color,
  };

  const paint = () => {
    const nameEl = sheet.querySelector("#dom-name");
    const initEl = sheet.querySelector("#dom-init");
    draft.name = nameEl.value;
    draft.initial = initEl.value.trim() || base.initial;
    const mark = sheet.querySelector(".dom-preview .pmark");
    mark.textContent = draft.initial;
    mark.style.background = draft.color;
    mark.style.color = readableOn(draft.color);
    sheet.querySelector(".dom-preview b").textContent = draft.name.trim() || base.name;
    sheet.querySelectorAll(".swatches button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.c === draft.color));
  };

  openSheet(`
    <h3>표시 설정</h3>
    <p class="sub">${base.isDomain
      ? `${esc(base.host)}의 작품을 한 묶음으로 보여줍니다.`
      : `기본값은 ${esc(base.name)} · ${esc(base.initial)} 입니다.`}</p>
    <div class="dom-preview">
      <span class="pmark" style="background:${draft.color};color:${readableOn(draft.color)}">${esc(draft.initial)}</span>
      <b>${esc(draft.name || base.name)}</b>${base.isDomain ? `<em>${esc(base.host)}</em>` : ""}
    </div>
    <div class="field">
      <label for="dom-name">이름</label>
      <input id="dom-name" value="${esc(draft.name)}" placeholder="${esc(base.name)}" maxlength="20">
    </div>
    <div class="field">
      <label for="dom-init">마크 <span style="text-transform:none;letter-spacing:0">— 표지와 목록에 붙는 한두 글자</span></label>
      <input id="dom-init" value="${esc(draft.initial)}" maxlength="2" style="width:80px">
    </div>
    <div class="field">
      <label>색</label>
      <div class="swatches">${DOMAIN_COLORS.map(c =>
        `<button data-c="${c}" style="background:${c}" aria-pressed="${c === draft.color}" aria-label="${c}"></button>`).join("")}</div>
    </div>
    <div class="link-row" style="margin-top:4px">
      ${overrides[platformId] ? `<button class="btn" data-reset>기본값으로</button>` : ""}
      <button class="btn primary" data-save>저장</button>
    </div>
  `);

  sheet.querySelector("#dom-name").addEventListener("input", paint);
  sheet.querySelector("#dom-init").addEventListener("input", paint);
  sheet.querySelector(".swatches").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    draft.color = b.dataset.c; paint();
  });
  sheet.querySelector("[data-save]").onclick = () => {
    const name = draft.name.trim();
    overrides[platformId] = { name: name || base.name, initial: draft.initial, color: draft.color };
    save(); render(); closeSheet();
  };
  const reset = sheet.querySelector("[data-reset]");
  if (reset) reset.onclick = () => { delete overrides[platformId]; save(); render(); closeSheet(); };
  paint();
}

    openWorkSettings(b.dataset.uf, { back: openUnfiled, mode: "add" });

function openAdd(prefill, heading, sub, pending, draftSched) {
  const chosen = pending || (openFolderId && openFolderId[0] !== "_" ? [openFolderId] : []);
  // 일정 초안은 시트가 다시 그려져도 유지된다. seriesId가 바뀔 때만 자동값으로 덮어쓴다.
  const draft = draftSched || { mode: "unknown", days: [] };
  let lastKey = draftSched ? "keep" : null;
  openSheet(`
    <div class="crumb">
      <button data-back-inbox aria-label="돌아가기">‹</button>
      <h3>${heading}</h3>
    </div>
    <p class="sub">${sub}</p>
    <div class="field">
      <label for="in-url">URL</label>
      <textarea id="in-url" spellcheck="false" placeholder="https://…">${esc(prefill || "")}</textarea>
    </div>
    <div id="add-preview"></div>
  `);
  sheet.querySelector("[data-back-inbox]").onclick = openInbox;
  const input = sheet.querySelector("#in-url");
  const preview = sheet.querySelector("#add-preview");

  function update() {
    const r = parseShared(input.value);
    if (r.state === "empty") { preview.innerHTML = ""; return; }
    if (r.state === "invalid" || r.state === "short") {
      preview.innerHTML = `<div class="note">${esc(r.message)}</div>`; return;
    }
    const p = r.platform;
    const key = `${p.id}:${r.seriesId}`;
    const hit = lookupCatalog(p.id, r.seriesId);
    // 새 작품이 식별되면 카탈로그 값으로 초안을 채운다
    if (key !== lastKey) {
      lastKey = key;
      if (hit) Object.assign(draft, { mode: hit.rest ? "hiatus" : "weekly", days: [...hit.days], next: null });
      else Object.assign(draft, { mode: "unknown", days: [], next: null });
    }
    const autoNote = hit
      ? `<span style="color:var(--good)">자동 감지됨</span> — 연재 목록에서 찾았습니다${hit.rest ? " (휴재 중)" : ""}`
      : hit === null
      ? `<span style="color:var(--warn)">연재 목록에 없습니다</span> — 완결이거나 연재 중이 아닌 작품입니다`
      : p.sched === "api"
      ? `<span style="color:var(--warn)">자동 감지 불가</span> — ${esc(p.name)}은 실서비스에선 자동이지만 이 데모에 목록이 없습니다`
      : `<span style="color:var(--warn)">자동 감지 불가</span> — ${esc(p.name)}에서는 일정을 얻을 수 없어 직접 고릅니다`;
    preview.innerHTML = `
      ${r.message ? `<div class="note">${esc(r.message)}</div>` : ""}
      <dl class="kv">
        <dt>플랫폼</dt><dd>${p.name} · ${MEDIA[r.mediaType]}</dd>
      </dl>
      <div class="field">
        <label for="in-title">제목 <span style="text-transform:none;letter-spacing:0">— 실제 서비스에서는 서버가 자동 수집</span></label>
        <input id="in-title" value="${esc(hit ? hit.title : "")}" placeholder="작품 제목을 입력하세요">
      </div>
      ${schedHtml(draft, autoNote)}
      ${pickerHtml(chosen)}
      <button class="btn primary" style="width:100%" id="do-add">목록에 등록</button>
    `;
    const titleEl = preview.querySelector("#in-title");
    wireSched(preview, draft, redraw => { if (redraw) update(); });
    wirePicker(preview, chosen, () => {},
      () => openAdd(input.value, heading, sub, chosen, draft));
    preview.querySelector("#do-add").onclick = () => {
      const title = titleEl.value.trim();
      if (!title) { titleEl.focus(); return; }
      const dup = works.find(w => w.platformId === p.id && w.seriesId === r.seriesId);
      if (dup) {
        dup.lastAt = Date.now();
        if (r.episode) dup.episode = r.episode;
        for (const fid of chosen) if (!dup.folders.includes(fid)) dup.folders.push(fid);
        dup.schedule = { ...draft, days: [...(draft.days || [])] };
      } else {
        works.push({ id: "w" + Date.now(), title, platformId: p.id, mediaType: r.mediaType,
          seriesId: r.seriesId, listUrl: r.listUrl, appUrl: r.appUrl || null,
          episode: r.episode || null, lastAt: Date.now(), folders: [...chosen],
          schedule: { ...draft, days: [...(draft.days || [])] },
          state: "active", visits: 0, filed: chosen.length > 0 });
      }
      save(); closeSheet(); tab = "home"; openFolderId = null; render();
      if (!chosen.length) openUnfiled();  // 폴더를 안 정했으면 대기열이 늘었다 — 바로 분류시킨다
    };
  }
  input.addEventListener("input", update);
  update();
  input.focus();
}

/* 요일 카탈로그 조회 — 실서비스의 서버 조회를 스냅샷으로 대신한다.
   반환: {title, days[]}  또는  null(카탈로그에 없음)  또는  undefined(카탈로그 자체가 없는 플랫폼) */
function lookupCatalog(platformId, seriesId) {
  const cat = CATALOG[platformId];
  if (!cat) return undefined;
  const hit = cat[String(seriesId)];
  if (!hit) return null;
  const [title, mask, rest] = hit;
  const days = [];
  for (let i = 0; i < 7; i++) if (mask & (1 << i)) days.push(i);
  return { title, days, rest: !!rest };
}
