<!doctype html>
<!-- 시스템이 다크 모드여도 항상 밝은 화면으로 — styles.css 의 다크 블록이 이 값을 보고 비켜난다 -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C94F0D">
<!-- 표지는 남의 CDN(네이버·카카오·인스타그램·넷플릭스…)에서 그대로 가져다 쓴다.
     그런 곳은 대개 **다른 사이트에서 부르는 것**을 막는데, 그 판단을 Referer 로 한다.
     아예 안 보내면 "어디서 왔는지 모르는 요청" 이 되어 통과하는 경우가 많다.
     덤으로, 우리 주소를 CDN 마다 알리지 않는다. -->
<meta name="referrer" content="no-referrer">
<title>HabHobby</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>
  /* 테마 색은 서버에서 받아 와야 알 수 있는데, 그때는 이미 styles.css 의 기본 주황이
     한 번 그려진 뒤다 — 새로 고칠 때마다 주황이 번쩍이고 나서 고른 색으로 바뀌었다.
     app.js 가 지난번에 얹은 값을 그대로 담아 두므로, 첫 그림 전에 그것부터 되살린다.
     여기서 색을 계산하지는 않는다 — 계산은 app.js 한 곳에만 있다. */
  try {
    var v = JSON.parse(localStorage.getItem("hh-theme") || "null");
    if (v) for (var k in v) {
      if (k === "theme-color") document.querySelector('meta[name="theme-color"]').content = v[k];
      else document.documentElement.style.setProperty(k, v[k]);
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="page">
    <div class="app">
      <div class="app-bar">
        <div class="bar-left">
          <!-- 좁은 화면에서는 알림 종이 사이드 메뉴 안으로 들어간다. 메뉴를 열지 않으면
               소식이 온 줄을 알 수 없으므로, 여는 버튼이 대신 숫자를 지고 있는다. -->
          <button class="icon-btn" id="btn-menu" aria-label="메뉴 열기" title="메뉴"
            >☰<span class="fab-badge" id="menu-badge" hidden></span></button>
          <button class="icon-btn" id="btn-search" aria-label="작품 검색" title="검색">🔍</button>
          <div class="brand">Hab<span>Hobby</span></div>
        </div>
        <div class="bar-right">
          <!-- 폴더 연결이 끊겼다는 소식. 탭 옆에 두는 이유는 그것이 **어느 탭에서든 오는**
               소식이기 때문이다 — 폴더 탭 안에 숨겨 두면 캘린더만 보는 사람에게는 안 온다. -->
          <button class="icon-btn bell" id="btn-bell" aria-label="알림" title="알림">
            🔔<span class="fab-badge" id="bell-badge" hidden></span>
          </button>
          <div class="tabs" role="tablist">
            <button role="tab" id="tab-cal" aria-selected="true">캘린더</button>
            <button role="tab" id="tab-home" aria-selected="false">페이지</button>
            <button role="tab" id="tab-lib" aria-selected="false">폴더</button>
          </div>
        </div>
      </div>

      <div class="screen" id="screen"></div>

      <button class="fab" id="btn-inbox" aria-label="작품 추가">
        ＋<span class="fab-badge" id="fab-badge" hidden></span>
      </button>
      <!-- 캘린더에서만 나타난다. 달력 칸에 안 보이는 것들을 곁창으로 연다. -->
      <button class="fab right" id="btn-idle" aria-label="추가 목록" title="추가 목록" hidden>
        📋<span class="fab-badge" id="idle-badge" hidden></span>
      </button>
      <!-- 폴더 탭에서만, 받은 초대가 있을 때만 나온다. 추가 목록과 같은 자리를 쓴다 —
           한쪽은 캘린더에서만, 한쪽은 폴더에서만 나오므로 겹치지 않는다. -->
      <button class="fab right" id="btn-fi" aria-label="폴더 초대" title="폴더 초대" hidden>
        🤝<span class="fab-badge" id="fi-badge" hidden></span>
      </button>

      <div class="drawer-back" id="drawer-back" hidden>
        <nav class="drawer">
          <div class="handle-zone vert" aria-hidden="true"><div class="handle"></div></div>
          <button class="drawer-x" id="menu-close" aria-label="메뉴 닫기" title="닫기">✕</button>
          <div class="drawer-head">
            <b>Hab<span>Hobby</span></b>
            <!-- 좁은 화면에서만. 넓은 화면에서는 상단바 탭 옆에 그대로 선다. -->
            <button class="icon-btn bell" id="menu-bell" aria-label="알림" title="알림"
              >🔔<span class="fab-badge" id="menu-bell-badge" hidden></span></button>
          </div>
          <button class="menu-item" id="menu-search">
            <span class="mi">🔍</span>
            <span class="mt">검색<small>제목으로 전체에서 찾기</small></span>
          </button>
          <button class="menu-item" id="menu-friends">
            <span class="mi">👥</span>
            <span class="mt">친구<small><span data-count="friends">0</span>명 · 폴더 공유</small></span>
          </button>
          <button class="menu-item" id="menu-watched">
            <span class="mi">✓</span>
            <span class="mt">감상 완료<small><span data-count="watched">0</span>편</small></span>
          </button>
          <button class="menu-item" id="menu-dropped">
            <span class="mi">🗑</span>
            <span class="mt">휴지통<small><span data-count="dropped">0</span>편</small></span>
          </button>
          <div class="drawer-foot">
            <span id="drawer-stat"></span>
            <button class="icon-btn" id="menu-settings" aria-label="설정" title="설정">⚙</button>
          </div>
        </nav>
      </div>

      <div class="sheet-back" id="sheet-back" hidden>
        <div class="sheet" id="sheet"></div>
      </div>
    </div>

</div>
<script type="module" src="/app.js"></script>
</body>
</html>
